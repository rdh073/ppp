name: android-settings-private-dns-script
version: 2
entry: configure_dns

inputs:
  private_dns_hostname:
    required: true
    label: "Private DNS hostname"
    hint: "e.g. dns.quad9.net"

steps:
  configure_dns:
    trigger: {}
    script:
      source: |
        var hostname = params.hostname;
        tap({ kind: "open_app", target: { kind: "package_name", value: "com.android.settings" } });
        if (!waitFor({ kind: "text", value: "Private DNS" }, 5000)) {
          if (waitFor({ kind: "text", value: "Network & internet" }, 3000)) {
            tap({ kind: "click", target: { kind: "text", value: "Network & internet" } });
          }
        }
        if (!waitFor({ kind: "text", value: "Private DNS" }, 5000)) {
          throw new Error("Could not find Private DNS option in Settings");
        }
        tap({ kind: "click", target: { kind: "text", value: "Private DNS" } });
        if (!waitFor({ kind: "resource_id", value: "com.android.settings:id/private_dns_mode_provider" }, 5000)) {
          throw new Error("Private DNS provider option not found");
        }
        tap({ kind: "click", target: { kind: "resource_id", value: "com.android.settings:id/private_dns_mode_provider" } });
        if (!waitFor({ kind: "resource_id", value: "com.android.settings:id/private_dns_mode_provider_hostname" }, 5000)) {
          throw new Error("Hostname input field not found");
        }
        input({ kind: "resource_id", value: "com.android.settings:id/private_dns_mode_provider_hostname" }, hostname);
        if (!waitFor({ kind: "resource_id", value: "android:id/button1" }, 3000)) {
          throw new Error("Save button not found");
        }
        tap({ kind: "click", target: { kind: "resource_id", value: "android:id/button1" } });
        return { configured: true };
      params:
        hostname: "{{input.private_dns_hostname}}"
      outputs:
        configured: dns_configured
      timeout: 45s
    on_success: terminal
    on_failure: terminal
