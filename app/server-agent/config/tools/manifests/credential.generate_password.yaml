name: credential.generate_password
provider: builtin
providerToolName: credential.generate_password
description: Generates a strong local password
deterministic: false
timeout: 250ms
retryBudget: 0
inputSchema:
  type: object
  properties:
    length:
      type: integer
    includeSymbols:
      type: boolean
outputSchema:
  type: object
  required: [password, length, hasSymbol]
  properties:
    password:
      type: string
    length:
      type: integer
    hasSymbol:
      type: boolean
