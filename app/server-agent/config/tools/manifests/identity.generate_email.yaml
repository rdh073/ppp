name: identity.generate_email
provider: builtin
providerToolName: identity.generate_email
description: Composes an email address from a known name
deterministic: true
timeout: 250ms
retryBudget: 0
inputSchema:
  type: object
  required: [fullName]
  properties:
    fullName:
      type: string
    domain:
      type: string
outputSchema:
  type: object
  required: [email, localPart, domain]
  properties:
    email:
      type: string
    localPart:
      type: string
    domain:
      type: string
