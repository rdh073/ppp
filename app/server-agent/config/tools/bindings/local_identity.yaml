bindings:
  - id: local_identity.generate_persona
    tool: identity.generate_persona
    paramsTemplate: |
      {}
    successArtifacts:
      - artifact: profile_full_name
        fromJsonPointer: /fullName
      - artifact: profile_first_name
        fromJsonPointer: /firstName
      - artifact: profile_last_name
        fromJsonPointer: /lastName
      - artifact: profile_gender
        fromJsonPointer: /gender
      - artifact: profile_email
        fromJsonPointer: /email
      - artifact: profile_username
        fromJsonPointer: /username

  - id: local_identity.generate_password
    tool: credential.generate_password
    constants:
      length: 20
      includeSymbols: true
    paramsTemplate: |
      {
        "length": {{ json (constant "length") }},
        "includeSymbols": {{ json (constant "includeSymbols") }}
      }
    successArtifacts:
      - artifact: profile_password
        fromJsonPointer: /password
      - artifact: profile_password_length
        fromJsonPointer: /length
      - artifact: profile_password_hasSymbol
        fromJsonPointer: /hasSymbol

  - id: local_identity.generate_birth_date
    tool: identity.generate_birth_date
    constants:
      minAge: 25
      maxAge: 35
    paramsTemplate: |
      {
        "minAge": {{ json (constant "minAge") }},
        "maxAge": {{ json (constant "maxAge") }}
      }
    successArtifacts:
      - artifact: profile_birth_date
        fromJsonPointer: /birthDate
      - artifact: profile_age
        fromJsonPointer: /age
      - artifact: profile_reference_date
        fromJsonPointer: /referenceDate

  - id: local_identity.generate_welcome_email
    tool: content.generate_welcome_email
    optional: true
    constants:
      productName: AutoSDK
      senderName: AutoSDK
      language: id
      tone: professional_warm
    paramsTemplate: |
      {
        "fullName": {{ json (artifact "profile_full_name") }},
        "email": {{ json (artifact "profile_email") }},
        "productName": {{ json (constant "productName") }},
        "senderName": {{ json (constant "senderName") }},
        "language": {{ json (constant "language") }},
        "tone": {{ json (constant "tone") }}
      }
    successArtifacts:
      - artifact: welcome_email_subject
        fromJsonPointer: /subject
      - artifact: welcome_email_body
        fromJsonPointer: /body
      - artifact: welcome_email_language
        fromJsonPointer: /language
      - artifact: welcome_email_tone
        fromJsonPointer: /tone
      - artifact: welcome_email_generation_mode
        value: llm
    failureArtifacts:
      - artifact: welcome_email_subject
        value: Selamat datang di AutoSDK
      - artifact: welcome_email_body
        template: |
          Halo {{ default "Pengguna" (artifact "profile_full_name") }},
          
          Akun AutoSDK Anda sudah siap digunakan. Email yang kami siapkan untuk profil ini adalah {{ artifact "profile_email" }}. Silakan lanjutkan verifikasi dan simpan kredensial Anda dengan aman sebelum memulai workflow berikutnya.
          
          Jika Anda membutuhkan bantuan, balas email ini dan tim AutoSDK akan membantu Anda.
          
          Salam,
          AutoSDK
      - artifact: welcome_email_language
        value: id
      - artifact: welcome_email_tone
        value: professional_warm
      - artifact: welcome_email_generation_mode
        value: fallback_template
      - artifact: welcome_email_error
        template: |
          {{ .ToolError }}
