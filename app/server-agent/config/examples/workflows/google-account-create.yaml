# Workflow: create a new Google account via Android Settings.
# Persona data (name, username, birth date, password) is fully generated by
# LLM/builtin tools — no input artifacts are required from the caller.
#
# Load with:  go run ./cmd/server -workflow-dir config/examples/workflows
# Create task:
#   POST /tasks {
#     "goal": "create new Google account",
#     "workflowName": "google-account-create"
#   }
#
# Tool dependencies (must be registered in config/tools/):
#   identity.generate_persona    — LLM; produces firstName, lastName, genderLabel, username
#   identity.generate_birth_date — builtin; produces birthMonth, birthDay, birthYear
#   credential.generate_password — builtin; produces password
#
# Artifact flow:
#   generate_persona      → first_name, last_name, gender_label, gmail_username
#   generate_birth_date   → birth_month, birth_day, birth_year
#   generate_password     → password

name: google-account-create
version: 2
entry: generate_persona

steps:

  # ── Step 1: generate identity persona via LLM ─────────────────────────────
  generate_persona:
    trigger: {}
    tool_call:
      tool_name: identity.generate_persona
      params: {}
      outputs:
        firstName:   first_name
        lastName:    last_name
        genderLabel: gender_label
        username:    gmail_username
    on_success: generate_birth_date
    on_failure: terminal

  # ── Step 2: generate a realistic birth date (age 25–35) ───────────────────
  generate_birth_date:
    trigger: {}
    tool_call:
      tool_name: identity.generate_birth_date
      params:
        minAge: 25
        maxAge: 35
      outputs:
        birthMonth: birth_month
        birthDay:   birth_day
        birthYear:  birth_year
    on_success: generate_password
    on_failure: terminal

  # ── Step 3: generate a strong password ────────────────────────────────────
  generate_password:
    trigger: {}
    tool_call:
      tool_name: credential.generate_password
      params:
        length: 20
        includeSymbols: true
      outputs:
        password: password
    on_success: open_settings
    on_failure: terminal

  # ── Step 4: launch Settings ────────────────────────────────────────────────
  open_settings:
    trigger: {}
    action:
      kind: open_app
      package: com.android.settings
    expect:
      kind: android.screen.changed
      package: com.android.settings
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 2
    on_success: tap_accounts
    on_failure: terminal

  # ── Step 5: navigate to Accounts ──────────────────────────────────────────
  tap_accounts:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Accounts"
    expect:
      kind: android.screen.changed
      package: com.android.settings
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 3
    on_success: tap_add_account
    on_failure: terminal

  # ── Step 6: tap "Add account" ─────────────────────────────────────────────
  tap_add_account:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Add account"
    expect:
      kind: android.screen.changed
      package: com.android.settings
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_google
    on_failure: terminal

  # ── Step 7: select Google from the account-type list ──────────────────────
  tap_google:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Google"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 2
    on_success: tap_create_account
    on_failure: terminal

  # ── Step 8: choose "Create account" on the sign-in screen ─────────────────
  tap_create_account:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Create account"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_for_myself
    on_failure: terminal

  # ── Step 9: select "For myself" ───────────────────────────────────────────
  tap_for_myself:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "For myself"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_first_name
    on_failure: terminal

  # ── Step 10: fill first name ──────────────────────────────────────────────
  enter_first_name:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "firstName"
      input_text: "{{input.first_name}}"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_last_name
    on_failure: terminal

  # ── Step 11: fill last name ───────────────────────────────────────────────
  enter_last_name:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "lastName"
      input_text: "{{input.last_name}}"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_name
    on_failure: terminal

  # ── Step 12: advance past name screen ─────────────────────────────────────
  tap_next_after_name:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_birth_month
    on_failure: terminal

  # ── Step 13: enter birth month ────────────────────────────────────────────
  enter_birth_month:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "month"
      input_text: "{{input.birth_month}}"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_birth_day
    on_failure: terminal

  # ── Step 14: enter birth day ──────────────────────────────────────────────
  enter_birth_day:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "day"
      input_text: "{{input.birth_day}}"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_birth_year
    on_failure: terminal

  # ── Step 15: enter birth year ─────────────────────────────────────────────
  enter_birth_year:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "year"
      input_text: "{{input.birth_year}}"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: select_gender
    on_failure: terminal

  # ── Step 16: select gender ────────────────────────────────────────────────
  # {{input.gender_label}} is "Male" or "Female" — the capitalised UI label
  # produced by identity.generate_persona → genderLabel.
  select_gender:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "{{input.gender_label}}"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_birthday
    on_failure: tap_next_after_birthday

  # ── Step 17: advance past birthday + gender screen ────────────────────────
  tap_next_after_birthday:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_create_own_email
    on_failure: terminal

  # ── Step 17: choose "Create your own Gmail address" ───────────────────────
  tap_create_own_email:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Create your own Gmail address"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_gmail_username
    on_failure: terminal

  # ── Step 19: type the generated Gmail username ────────────────────────────
  # {{input.gmail_username}} comes from identity.generate_persona → username.
  enter_gmail_username:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "customEmail"
      input_text: "{{input.gmail_username}}"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_email
    on_failure: terminal

  # ── Step 17: advance past Gmail username screen ───────────────────────────
  tap_next_after_email:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_password
    on_failure: terminal

  # ── Step 18: set password (generated by credential.generate_password) ─────
  enter_password:
    trigger: {}
    action:
      kind: fill_form
      fields:
        - target:
            kind: resource_id
            value: "password"
          value: "{{input.password}}"
        - target:
            kind: resource_id
            value: "confirmPassword"
          value: "{{input.password}}"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_password
    on_failure: terminal

  # ── Step 19: advance past password screen ────────────────────────────────
  tap_next_after_password:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: skip_phone
    on_failure: terminal

  # ── Step 20: skip phone number ────────────────────────────────────────────
  skip_phone:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Skip"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_review
    on_failure: tap_next_review

  # ── Step 21: confirm account info review ──────────────────────────────────
  tap_next_review:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: accept_terms
    on_failure: terminal

  # ── Step 22: accept privacy & terms ──────────────────────────────────────
  accept_terms:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "I agree"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 2
    on_success: save_to_registry
    on_failure: terminal

  # ── Step 23: persist account in account-service ───────────────────────────
  # Requires AUTO_ACCOUNT_SERVICE_URL to be set; skips gracefully if not configured.
  save_to_registry:
    trigger: {}
    tool_call:
      tool_name: account.register_google
      params:
        email:    "{{input.gmail_username}}@gmail.com"
        password: "{{input.password}}"
        deviceId: "{{input.device_id}}"
      outputs:
        accountId: google_account_id
    on_success: terminal
    on_failure: terminal
