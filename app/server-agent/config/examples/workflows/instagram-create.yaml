# Workflow: create a new Instagram account.
#
# Load with:  go run ./cmd/server -workflow-dir config/examples/workflows
# Create task:
#   POST /tasks {
#     "goal": "create new Instagram account",
#     "workflowName": "instagram-create",
#     "inputArtifacts": {
#       "phone_or_email": "+6281234567890",
#       "full_name":      "Jane Doe",
#       "password":       "StrongPass123!",
#       "username":       "janedoe.example"
#     }
#   }
#
# Required input artifacts:
#   phone_or_email — phone number (+cc…) or email address for registration
#   full_name      — display name shown on the profile
#   password       — desired account password
#   username       — desired Instagram handle (without @)
#
# Tool dependencies:
#   sms.read_otp — reads the most recent SMS and extracts a numeric OTP.
#                  Must be registered in the tool catalog before running this
#                  workflow. Output key: otp_code → stored as input.otp_code.
#                  Omit the read_otp step (and wire enter_otp directly after
#                  tap_next_after_contact) if OTP is provided as an input
#                  artifact instead.
#
# Assumptions:
#   - Instagram is installed and not currently logged in.
#   - Registration starts from the Instagram home / welcome screen.
#   - "Sign up with email or phone number" path is used (not Facebook SSO).
#   - Instagram asks for OTP confirmation before proceeding.
#   - Suggested username step offers {{input.username}}; if it conflicts the
#     step retries up to max_retry times before terminal.
#   - "Save your login info?" and contact-sync prompts after completion are
#     not handled; workflow terminates on the first post-signup screen.

name: instagram-create
version: 2
entry: open_instagram

steps:

  # ── Step 1: launch Instagram ───────────────────────────────────────────────
  open_instagram:
    trigger: {}
    action:
      kind: open_app
      package: com.instagram.android
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 20s
    max_retry: 2
    on_success: tap_create_account
    on_failure: terminal

  # ── Step 2: tap "Create new account" on the welcome screen ────────────────
  tap_create_account:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Create new account"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_signup_with_contact
    on_failure: terminal

  # ── Step 3: choose "Sign up with email or phone number" ───────────────────
  tap_signup_with_contact:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Sign up with email or phone number"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_contact
    on_failure: terminal

  # ── Step 4: enter phone number or email ───────────────────────────────────
  enter_contact:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "com.instagram.android:id/registration_phone_or_email"
      input_text: "{{input.phone_or_email}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_contact
    on_failure: terminal

  # ── Step 5: advance — Instagram sends OTP to phone/email ──────────────────
  tap_next_after_contact:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 2
    on_success: read_otp
    on_failure: terminal

  # ── Step 6: read OTP from SMS ─────────────────────────────────────────────
  # Calls the sms.read_otp tool to extract the confirmation code from the
  # most recent inbound SMS. The extracted code is stored under input.otp_code
  # and interpolated in the next step.
  # Remove this step and pass otp_code as an inputArtifact if SMS access is
  # not available.
  read_otp:
    trigger: {}
    tool_call:
      tool_name: sms.read_otp
      params: {}
      outputs:
        otp_code: otp_code
    on_success: enter_otp
    on_failure: terminal

  # ── Step 7: enter confirmation code ───────────────────────────────────────
  enter_otp:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "com.instagram.android:id/confirmation_field"
      input_text: "{{input.otp_code}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_otp
    on_failure: terminal

  # ── Step 8: confirm OTP ───────────────────────────────────────────────────
  tap_next_after_otp:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_full_name
    on_failure: terminal

  # ── Step 9: enter full name ───────────────────────────────────────────────
  enter_full_name:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "com.instagram.android:id/full_name"
      input_text: "{{input.full_name}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_name
    on_failure: terminal

  # ── Step 10: advance to password screen ───────────────────────────────────
  tap_next_after_name:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_password
    on_failure: terminal

  # ── Step 11: create password ──────────────────────────────────────────────
  enter_password:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "com.instagram.android:id/password"
      input_text: "{{input.password}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_password
    on_failure: terminal

  # ── Step 12: advance to birthday/username screen ──────────────────────────
  tap_next_after_password:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_username
    on_failure: terminal

  # ── Step 13: set username ─────────────────────────────────────────────────
  # Instagram pre-fills a suggestion; this step clears and types the desired
  # handle. If the handle is taken, the step fails after max_retry.
  enter_username:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "com.instagram.android:id/username"
      input_text: "{{input.username}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 3
    on_success: tap_next_after_username
    on_failure: terminal

  # ── Step 14: confirm username ─────────────────────────────────────────────
  tap_next_after_username:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: accept_terms
    on_failure: terminal

  # ── Step 15: agree to terms of service ────────────────────────────────────
  accept_terms:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "I agree"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 2
    on_success: terminal
    on_failure: terminal
