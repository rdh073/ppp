# Declarative workflow for setting Android Private DNS through the Settings UI.
#
# Load with: go run ./cmd/server -workflow-dir config/examples/workflows
# Create task: POST /tasks {"goal":"set private dns","workflowName":"android-settings-private-dns","inputArtifacts":{"private_dns_hostname":"dns.example.com"}}
#
# This example intentionally mixes semantic event matching with raw selectors.
# The current android-agent reliably emits `android.screen.changed` plus
# `ui.ui_ready`, and text-backed Settings rows are often strong enough for
# `semantic_key` selectors. The hostname input and dialog save button still use
# raw resource IDs here because stock Android Settings commonly exposes weak
# generic anchors for those controls.
#
# Schema: WorkflowDef v2 (trigger / action / tool_call / expect / on_success / on_failure)
#
# Step execution model
# --------------------
# - trigger non-empty  → wait for a matching device event before executing.
# - trigger empty      → auto-executed immediately when reached (no extra event needed).
#
# "UI no transition" handling
# ---------------------------
# Every action step arms an `expect` with a `timeout`. If the expect event never
# arrives before the deadline, the next incoming device event triggers a retry via
# handleFailure. After `max_retry` exhausted the step follows `on_failure`.
#
# Multi-device
# ------------
# Workflow state is keyed by (taskId, deviceId). The orchestrator serialises
# ProcessEvent calls per device so concurrent devices run independently.
#
# Required input artifact
# -----------------------
#   private_dns_hostname  — hostname to configure, e.g. "dns.example.com"

name: android-settings-private-dns
version: 2

# Entry step fires on the first event that arrives after the task is assigned
# (typically agent.online or an accessibility event). Its empty trigger means
# "activate on any event" — the first device event kicks off the workflow.
entry: open_settings

steps:

  # ── Step 1: open Settings ──────────────────────────────────────────────────
  open_settings:
    # Activated by any incoming event (agent.online, first accessibility event …).
    trigger: {}
    action:
      kind: open_app
      package: com.android.settings
    expect:
      kind: android.screen.changed
      text_contains: "Private DNS"
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 1
    on_success: click_private_dns
    on_failure: terminal

  # ── Step 2: optional tap "Network & internet" from Settings homepage ───────
  # Kept as fallback/manual branch helper; not on the main path for Waydroid.
  click_network:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Network & internet"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 1
    on_success: click_private_dns
    on_failure: click_private_dns

  # ── Step 3: tap "Private DNS" ──────────────────────────────────────────────
  click_private_dns:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Private DNS"
    expect:
      kind: android.screen.changed
      text_contains: "Select Private DNS Mode"
      ui:
        ui_ready: true
    timeout: 5s
    max_retry: 0
    on_success: click_hostname_option
    on_failure: click_hostname_option

  # ── Step 4: choose "Private DNS provider hostname" ─────────────────────────
  click_hostname_option:
    trigger: {}
    action:
      kind: click
      target:
        kind: resource_id
        value: "com.android.settings:id/private_dns_mode_provider"
    expect:
      kind: android.screen.changed
      text_contains: "Enter hostname of DNS provider"
      ui:
        ui_ready: true
    timeout: 5s
    max_retry: 0
    on_success: input_hostname
    on_failure: input_hostname

  # ── Step 5: type the hostname ──────────────────────────────────────────────
  # {{input.private_dns_hostname}} is interpolated from task.inputArtifacts.
  input_hostname:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "com.android.settings:id/private_dns_mode_provider_hostname"
      input_text: "{{input.private_dns_hostname}}"
    on_success: click_save
    on_failure: click_save

  # ── Step 6: tap "Save" ─────────────────────────────────────────────────────
  click_save:
    trigger: {}
    action:
      kind: click
      target:
        kind: resource_id
        value: "android:id/button1"
    on_success: terminal
    on_failure: terminal
