# Workflow: sign in to an existing Instagram account.
#
# Load with:  go run ./cmd/server -workflow-dir config/examples/workflows
# Create task:
#   POST /tasks {
#     "goal": "log in to Instagram",
#     "workflowName": "instagram-login",
#     "inputArtifacts": {
#       "instagram_username": "user@example.com",
#       "instagram_password": "secret"
#     }
#   }
#
# Required input artifacts:
#   instagram_username — phone number, email, or username
#   instagram_password — account password
#
# Assumptions:
#   - Instagram is already installed (com.instagram.android).
#   - The login screen is the first screen after launching the app
#     (i.e. no existing session). If the app resumes to a logged-in state
#     the workflow will stall at wait_login_screen.
#   - The semantic projection classifies the login form under the key
#     `form.primary` with targets `form.primary.email` and
#     `form.primary.password`, matching the same convention as
#     android-semantic-login.yaml. Adjust to resource_id selectors if the
#     accessibility tree exposes different IDs:
#       username: com.instagram.android:id/login_username
#       password: com.instagram.android:id/password
#   - A "Save your login info?" prompt may appear after successful login;
#     the workflow does not handle it and falls through to terminal.

name: instagram-login
version: 2
entry: open_instagram

steps:

  # ── Step 1: launch Instagram ───────────────────────────────────────────────
  open_instagram:
    trigger: {}
    action:
      kind: open_app
      package: com.instagram.android
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 20s
    max_retry: 2
    on_success: wait_login_screen
    on_failure: terminal

  # ── Step 2: wait for login form ───────────────────────────────────────────
  # Trigger waits for an accessibility event indicating the login screen is
  # visible and the form is ready before filling credentials.
  wait_login_screen:
    trigger:
      kind: android.screen.changed
      ui:
        ui_ready: true
        form_key: form.primary
    action:
      kind: fill_form
      fields:
        - target:
            kind: semantic_key
            value: form.primary.email
          value: "{{input.instagram_username}}"
        - target:
            kind: semantic_key
            value: form.primary.password
          value: "{{input.instagram_password}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
        button_key: form.primary.submit
        button_enabled: true
    timeout: 15s
    max_retry: 2
    on_success: tap_login
    on_failure: terminal

  # ── Step 3: submit credentials ────────────────────────────────────────────
  tap_login:
    trigger: {}
    action:
      kind: click
      target:
        kind: semantic_key
        value: form.primary.submit
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 20s
    max_retry: 2
    on_success: terminal
    on_failure: terminal
