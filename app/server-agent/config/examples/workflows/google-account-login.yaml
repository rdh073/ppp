# Workflow: sign in to an existing Google account via Android Settings.
#
# Load with:  go run ./cmd/server -workflow-dir config/examples/workflows
# Create task:
#   POST /tasks {
#     "goal": "sign in to existing Google account",
#     "workflowName": "google-account-login",
#     "inputArtifacts": {
#       "google_email":    "user@gmail.com",
#       "google_password": "secret"
#     }
#   }
#
# Required input artifacts:
#   google_email    — Gmail / Google Workspace address
#   google_password — account password
#
# Assumptions:
#   - Settings exposes "Accounts" row with that exact label. On some OEMs the
#     row is labelled "Users & accounts" — adjust the text selector accordingly.
#   - The GAIA sign-in flow (com.google.android.gms) exposes the email field
#     under accessibility resource-id "identifierId" and the password field
#     under "password". Both are WebView-backed; actual IDs may differ by
#     Android/GMS version — substitute resource_id with a text selector if needed.
#   - An "I agree" / "Accept" terms screen may or may not appear after login
#     depending on account state. The final step attempts to tap it and follows
#     on_failure → terminal either way (accept_terms failure is non-fatal).

name: google-account-login
version: 2
entry: open_settings

steps:

  # ── Step 1: launch Settings ────────────────────────────────────────────────
  open_settings:
    trigger: {}
    action:
      kind: open_app
      package: com.android.settings
    expect:
      kind: android.screen.changed
      package: com.android.settings
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 2
    on_success: tap_accounts
    on_failure: terminal

  # ── Step 2: navigate to Accounts ──────────────────────────────────────────
  tap_accounts:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Accounts"
    expect:
      kind: android.screen.changed
      package: com.android.settings
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 3
    on_success: tap_add_account
    on_failure: terminal

  # ── Step 3: tap "Add account" ─────────────────────────────────────────────
  tap_add_account:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Add account"
    expect:
      kind: android.screen.changed
      package: com.android.settings
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_google
    on_failure: terminal

  # ── Step 4: select Google from the account-type list ──────────────────────
  tap_google:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Google"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 2
    on_success: enter_email
    on_failure: terminal

  # ── Step 5: type the email address ────────────────────────────────────────
  enter_email:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "identifierId"
      input_text: "{{input.google_email}}"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_email
    on_failure: terminal

  # ── Step 6: advance past email ────────────────────────────────────────────
  tap_next_after_email:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 2
    on_success: enter_password
    on_failure: terminal

  # ── Step 7: type the password ─────────────────────────────────────────────
  enter_password:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: resource_id
        value: "password"
      input_text: "{{input.google_password}}"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_password
    on_failure: terminal

  # ── Step 8: submit password ───────────────────────────────────────────────
  tap_next_after_password:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 20s
    max_retry: 2
    on_success: accept_terms
    on_failure: terminal

  # ── Step 9: accept terms if shown (non-fatal if not present) ──────────────
  accept_terms:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "I agree"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 2
    on_success: terminal
    on_failure: terminal
