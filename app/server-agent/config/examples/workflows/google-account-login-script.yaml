name: google-account-login-script
version: 1
entry: login

# Logs into an existing Google account via Android Settings → Add Account.
# Inputs: email (required), password (required)
# Returns: { loggedIn: bool }

steps:

  login:
    trigger: {}
    script:
      source: |
        // Open Add Account settings directly
        tap({ kind: "open_intent", intentAction: "android.settings.ADD_ACCOUNT_SETTINGS" });
        if (!waitFor({ kind: "text", value: "Google" }, 8000)) {
          throw new Error("Add account screen not found");
        }
        tap({ kind: "click", target: { kind: "text", value: "Google" } });

        // Wait for "Sign in" / email screen
        if (!waitFor({ kind: "text", value: "Sign in" }, 10000)) {
          // Some devices show email input immediately
          if (!waitFor({ kind: "content_desc", value: "Email or phone" }, 5000)) {
            throw new Error("Sign in screen not found");
          }
        }

        // --- Email / username ---
        if (waitFor({ kind: "content_desc", value: "Email or phone" }, 4000)) {
          input({ kind: "content_desc", value: "Email or phone" }, params.email);
        } else if (waitFor({ kind: "content_desc", value: "Phone number or email address" }, 2000)) {
          input({ kind: "content_desc", value: "Phone number or email address" }, params.email);
        } else {
          throw new Error("Email input not found");
        }
        tap({ kind: "click", target: { kind: "text", value: "Next" } });

        // --- Password ---
        if (!waitFor({ kind: "content_desc", value: "Enter your password" }, 10000)) {
          if (!waitFor({ kind: "content_desc", value: "Password" }, 5000)) {
            throw new Error("Password input not found");
          }
        }
        if (waitFor({ kind: "content_desc", value: "Enter your password" }, 2000)) {
          input({ kind: "content_desc", value: "Enter your password" }, params.password);
        } else {
          input({ kind: "content_desc", value: "Password" }, params.password);
        }
        tap({ kind: "click", target: { kind: "text", value: "Next" } });

        // --- 2-step verification (skip if not prompted) ---
        if (waitFor({ kind: "text", value: "2-Step Verification" }, 5000)) {
          // Try "Not now" or "Skip" if available
          if (waitFor({ kind: "text", value: "Not now" }, 3000)) {
            tap({ kind: "click", target: { kind: "text", value: "Not now" } });
          } else if (waitFor({ kind: "text", value: "Skip" }, 2000)) {
            tap({ kind: "click", target: { kind: "text", value: "Skip" } });
          }
        }

        // --- Accept terms if prompted ---
        if (waitFor({ kind: "text", value: "I agree" }, 5000)) {
          tap({ kind: "click", target: { kind: "text", value: "I agree" } });
        }

        // --- Confirm account in Settings ---
        // After login the Settings > Accounts page should show the email
        var loggedIn = waitFor({ kind: "text", value: params.email }, 10000);
        if (!loggedIn) {
          // Fallback: check for generic "account added" confirmation
          loggedIn = waitFor({ kind: "text", value: "Sync" }, 5000) ||
                     waitFor({ kind: "text", value: "Account sync" }, 3000);
        }

        return { loggedIn: loggedIn };
      params:
        email:    "{{input.email}}"
        password: "{{input.password}}"
      outputs:
        loggedIn: google_logged_in
      timeout: 120s
    on_success: terminal
    on_failure: terminal
