# Workflow: create a new Instagram account on Waydroid UI snapshots.
#
# Load with:  go run ./cmd/server -workflow-dir config/examples/workflows
# Create task:
#   POST /tasks {
#     "goal": "create new Instagram account",
#     "workflowName": "instagram-create-waydroid",
#     "inputArtifacts": {
#       "phone_or_email": "+6281234567890",
#       "otp_code": "123456",
#       "full_name": "Jane Doe",
#       "password": "StrongPass123!",
#       "username": "janedoe.example"
#     }
#   }
#
# Required input artifacts:
#   phone_or_email — phone number (or email) used on contact step
#   otp_code      — code from SMS confirmation
#   full_name     — display name
#   password      — account password
#   username      — requested Instagram username

name: instagram-create-waydroid
version: 2
entry: open_instagram

steps:

  # 1) Launch Instagram
  open_instagram:
    trigger: {}
    action:
      kind: open_app
      package: com.instagram.android
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 20s
    max_retry: 2
    on_success: tap_create_account
    on_failure: terminal

  # 2) From login screen, open signup flow
  tap_create_account:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Create new account"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_mobile_or_email
    on_failure: terminal

  # 3) Preferred branch: mobile number signup
  enter_mobile_or_email:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: content_description
        value: "Mobile number,"
      input_text: "{{input.phone_or_email}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_contact
    on_failure: enter_email

  # 4) Advance mobile flow
  tap_next_after_contact:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 2
    on_success: enter_otp
    on_failure: enter_email

  # 5) Fallback signup branch when phone flow is not shown
  enter_email:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: content_description
        value: "Email,"
      input_text: "{{input.phone_or_email}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_contact
    on_failure: terminal

  # 6) Enter OTP and proceed
  enter_otp:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: content_description
        value: "Code input entry field"
      input_text: "{{input.otp_code}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_otp
    on_failure: terminal

  # 7) Submit OTP
  tap_next_after_otp:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_password
    on_failure: terminal

  # 8) Create password
  enter_password:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: content_description
        value: "Password,"
      input_text: "{{input.password}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_password
    on_failure: terminal

  # 9) Open the birthday picker’s SET button when present.
  tap_set_birthday_if_needed:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "SET"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 8s
    max_retry: 1
    on_success: tap_next_after_birthday
    on_failure: tap_next_after_birthday

  # 10) Continue from password screen to birthday/name steps
  tap_next_after_password:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_set_birthday_if_needed
    on_failure: terminal

  # 11) Birthday step
  tap_next_after_birthday:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_full_name
    on_failure: enter_full_name

  # 12) Enter full name
  enter_full_name:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: content_description
        value: "Full name,"
      input_text: "{{input.full_name}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_name
    on_failure: terminal

  # 13) Advance full name screen
  tap_next_after_name:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: enter_username
    on_failure: terminal

  # 14) Username suggestion/edit
  enter_username:
    trigger: {}
    action:
      kind: input_text
      target:
        kind: class
        value: "android.widget.EditText"
      input_text: "{{input.username}}"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_username
    on_failure: terminal

  # 15) Submit username and move forward
  tap_next_after_username:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: accept_terms
    on_failure: terminal

  # 16) Terms confirmation
  accept_terms:
    trigger: {}
    action:
      kind: click
      target:
        kind: content_description
        value: "I agree"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 15s
    max_retry: 3
    on_success: skip_add_picture
    on_failure: terminal

  # 17) Skip adding profile photo
  skip_add_picture:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Skip"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: tap_next_after_add_picture
    on_failure: terminal

  # 18) Continue past contacts opt-in
  tap_next_after_add_picture:
    trigger: {}
    action:
      kind: click
      target:
        kind: resource_id
        value: "com.instagram.android:id/bb_primary_action_container"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 12s
    max_retry: 2
    on_success: handle_contacts_permission
    on_failure: terminal

  # 19) Optional system permission dialog.
  handle_contacts_permission:
    trigger: {}
    action:
      kind: click
      target:
        kind: resource_id
        value: "com.android.permissioncontroller:id/permission_deny_button"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 8s
    max_retry: 1
    on_success: tap_next_notification_prompt
    on_failure: tap_next_notification_prompt

  # 20) Continue to notifications prompt
  tap_next_notification_prompt:
    trigger: {}
    action:
      kind: click
      target:
        kind: text
        value: "Next"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 12s
    max_retry: 2
    on_success: handle_notification_settings
    on_failure: skip_contact_permissions_prompt

  # 21) Dismiss notification settings if it appears
  handle_notification_settings:
    trigger: {}
    action:
      kind: click
      target:
        kind: content_description
        value: "Navigate up"
    expect:
      kind: android.screen.changed
      ui:
        ui_ready: true
    timeout: 8s
    max_retry: 1
    on_success: skip_profile_setup
    on_failure: skip_profile_setup

  # 22) Skip profile-setup step
  skip_contact_permissions_prompt:
    trigger: {}
    action:
      kind: click
      target:
        kind: resource_id
        value: "com.instagram.android:id/action_bar_action_text"
      # value shown as "Skip"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: skip_profile_setup
    on_failure: skip_profile_setup

  # 23) Skip profile vibe setup
  skip_profile_setup:
    trigger: {}
    action:
      kind: click
      target:
        kind: resource_id
        value: "com.instagram.android:id/action_bar_action_text"
      # value shown as "Skip"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: skip_mobile_prompt
    on_failure: skip_mobile_prompt

  # 24) Skip optional mobile-number capture
  skip_mobile_prompt:
    trigger: {}
    action:
      kind: click
      target:
        kind: resource_id
        value: "com.instagram.android:id/action_bar_action_text"
      # value shown as "Skip"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: skip_follow_suggestions
    on_failure: skip_follow_suggestions

  # 25) Skip follow-suggestions flow
  skip_follow_suggestions:
    trigger: {}
    action:
      kind: click
      target:
        kind: resource_id
        value: "com.instagram.android:id/action_bar_action_text"
      # value shown as "Skip"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: skip_reels_intro
    on_failure: terminal

  # 26) Final intro skip
  skip_reels_intro:
    trigger: {}
    action:
      kind: click
      target:
        kind: resource_id
        value: "com.instagram.android:id/action_bar_action_text"
      # value shown as "Skip"
    expect:
      kind: android.screen.changed
      package: com.instagram.android
      ui:
        ui_ready: true
    timeout: 10s
    max_retry: 2
    on_success: terminal
    on_failure: terminal
